<!DOCTYPE html>
<html>
<head>

<title>ILUL STORE</title>

<style>

body{
font-family:Arial,sans-serif;
margin:0;
background:#f5f5f5;
}


/* HEADER */
header{

background:#111;
color:white;
text-align:center;
padding:25px;

}


.logo{

font-size:35px;
font-weight:bold;
color:#ffd700;

}



/* WALLPAPER / BANNER ILUL STORE */

.banner{

background:
linear-gradient(135deg,#000,#111827,#0066ff);

color:white;

padding:60px 20px;

text-align:center;

border-bottom:5px solid #ffd700;

box-shadow:0 0 30px #0066ff;

}



.brand{

font-size:55px;

font-weight:bold;

letter-spacing:3px;

color:#ffd700;

text-shadow:
0 0 10px #ffd700,
0 0 20px #ff9900;

}



.banner p{

font-size:22px;

}



/* MENU */

.menu{

background:white;

padding:15px;

text-align:center;

}


.menu a{

margin:15px;

text-decoration:none;

color:#111;

font-weight:bold;

}



/* PRODUK */

.produk-container{

display:flex;

justify-content:center;

gap:20px;

padding:30px;

flex-wrap:wrap;

}



.produk{

background:white;

width:250px;

padding:20px;

border-radius:15px;

text-align:center;

box-shadow:0 3px 10px #ccc;

}



.produk img{

width:200px;

height:200px;

object-fit:cover;

border-radius:10px;

}



.harga{

color:green;

font-size:22px;

font-weight:bold;

}



button{

background:#0066ff;

color:white;

border:none;

padding:12px 20px;

border-radius:5px;

cursor:pointer;

}



button:hover{

background:#003f99;

}



/* KERANJANG */

#keranjang{

background:white;

width:80%;

margin:20px auto;

padding:20px;

border-radius:15px;

}



input{

width:90%;

padding:12px;

margin:10px;

}



.hapus{

background:red;

padding:5px 10px;

}



.checkout{

background:green;

width:100%;

}



/* FOOTER */

footer{

background:#111;

color:white;

text-align:center;

padding:20px;

margin-top:30px;

}


</style>

</head>


<body>


<header>

<div class="logo">

🛒 ILUL STORE

</div>

<p>Toko Online Modern & Terpercaya</p>

</header>




<div class="banner">


<div class="brand">

🛒 ILUL STORE

</div>


<p>

Belanja Mudah, Cepat, dan Aman

</p>


<button>

MULAI BELANJA

</button>


</div>





<div class="menu">

<a href="#">Home</a>

<a href="#">Fashion</a>

<a href="#">Sepatu</a>

<a href="#">Tas</a>

</div>






<div class="produk-container">



<div class="produk">

<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">


<h2>Kaos Premium</h2>


<p class="harga">

Rp75.000

</p>


<button onclick="tambahKeranjang('Kaos Premium',75000)">

Beli

</button>


</div>






<div class="produk">

<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">


<h2>Sepatu Sport</h2>


<p class="harga">

Rp250.000

</p>


<button onclick="tambahKeranjang('Sepatu Sport',250000)">

Beli

</button>


</div>






<div class="produk">

<img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62">


<h2>Tas Fashion</h2>


<p class="harga">

Rp150.000

</p>


<button onclick="tambahKeranjang('Tas Fashion',150000)">

Beli

</button>


</div>






<div class="produk">

<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">


<h2>Jam Tangan</h2>


<p class="harga">

Rp300.000

</p>


<button onclick="tambahKeranjang('Jam Tangan',300000)">

Beli

</button>


</div>



</div>







<div id="keranjang">


<h2>🛒 Keranjang ILUL STORE</h2>


<input id="namaPembeli" placeholder="Nama Pembeli">


<ul id="isiKeranjang"></ul>


<h3>

Total : Rp<span id="total">0</span>

</h3>


<button class="checkout" onclick="checkout()">

Checkout WhatsApp

</button>


</div>







<footer>

© 2026 ILUL STORE

</footer>






<script>


let daftarBelanja=[];



function tambahKeranjang(nama,harga){


daftarBelanja.push({

nama:nama,

harga:harga

});


tampilkanKeranjang();


}





function tampilkanKeranjang(){


let isi=document.getElementById("isiKeranjang");


isi.innerHTML="";


let total=0;



daftarBelanja.forEach(function(item,index){


total += item.harga;



isi.innerHTML +=

"<li>"+

item.nama+

" - Rp"+

item.harga.toLocaleString("id-ID")+

" <button class='hapus' onclick='hapusItem("+index+")'>Hapus</button></li>";


});



document.getElementById("total").innerHTML=

total.toLocaleString("id-ID");


}






function hapusItem(index){


daftarBelanja.splice(index,1);


tampilkanKeranjang();


}







function checkout(){



let nama=document.getElementById("namaPembeli").value;



if(nama==""){

alert("Masukkan nama pembeli");

return;

}




if(daftarBelanja.length==0){

alert("Keranjang masih kosong");

return;

}




let pesan="Halo ILUL STORE, saya ingin membeli:%0A%0A";



daftarBelanja.forEach(function(item){


pesan +=

"- "+item.nama+

" Rp"+

item.harga.toLocaleString("id-ID")+

"%0A";


});




pesan +=

"%0ANama : "+nama+

"%0ATotal : Rp"+

document.getElementById("total").innerHTML;




window.open(

"https://wa.me/6283835969176?text="+

encodeURIComponent(pesan)

);



}



</script>


</body>
</html>
