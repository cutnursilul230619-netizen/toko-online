<!DOCTYPE html>
<html>
<head>
    <title>Toko Online Saya</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .produk-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            flex-wrap: wrap;
        }

        .produk {
            background: white;
            width: 250px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px #ccc;
        }

        .produk img {
            width: 200px;
            height: 200px;
            border-radius: 10px;
        }

        .harga {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background: blue;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: darkblue;
        }

        #keranjang {
            background: white;
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
        }
    </style>

</head>

<body>

<header>
    <h1>Toko Online Saya</h1>
    <p>Belanja Online Mudah</p>
</header>


<div class="produk-container">

    <div class="produk">
        <img src="https://via.placeholder.com/200">
        <h2>Kaos Premium</h2>
        <p class="harga">Rp75.000</p>
        <button onclick="tambahKeranjang('Kaos Premium')">
            Beli
        </button>
    </div>


    <div class="produk">
        <img src="https://via.placeholder.com/200">
        <h2>Sepatu Sport</h2>
        <p class="harga">Rp250.000</p>
        <button onclick="tambahKeranjang('Sepatu Sport')">
            Beli
        </button>
    </div>


    <div class="produk">
        <img src="https://via.placeholder.com/200">
        <h2>Tas Fashion</h2>
        <p class="harga">Rp150.000</p>
        <button onclick="tambahKeranjang('Tas Fashion')">
            Beli
        </button>
    </div>

</div>


<div id="keranjang">

    <h2>Keranjang Belanja</h2>

    <ul id="isiKeranjang">
    </ul>

</div>


<script>

let daftarBelanja = [];


function tambahKeranjang(namaProduk) {

    daftarBelanja.push(namaProduk);

    tampilkanKeranjang();

}


function tampilkanKeranjang() {

    let isi = document.getElementById("isiKeranjang");

    isi.innerHTML = "";

    daftarBelanja.forEach(function(produk){

        let item = document.createElement("li");

        item.innerHTML = produk;

        isi.appendChild(item);

    });

}

</script>


</body>
</html>
